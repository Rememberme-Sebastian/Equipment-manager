<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phoenix Team Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone-first kit room board. Sticky clock bar, tab strip, then stacked cards.
   Session chips reuse the colours of the club's season schedule sheet. */
:root {
  --bg: #eef0ee;
  --surface: #ffffff;
  --ink: #15181b;
  --muted: #5b636b;
  --line: #d9ddda;
  --accent: #f2c200;
  --accent-ink: #1a1500;
  --ok: #1e7d47;
  --warn: #9a5a00;
  --bad: #b3261e;
  --tt: #e23fb8; --tt-ink: #ffffff;
  --gym: #7ea9e3; --gym-ink: #0d1f3b;
  --bike: #ddd3bb; --bike-ink: #3a3220;
  --rec: #f2a52a; --rec-ink: #2a1800;
  --off: #e3e5e3; --off-ink: #4a5157;
  --travel: #ece6fb; --travel-ink: #4b2fa3;
  --home: #ffe14d; --home-ink: #2a2200;
  --away: #9be34a; --away-ink: #16300a;
  --tbc: #f6b73c; --tbc-ink: #2a1a00;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111416; --surface: #1a1e21; --ink: #eceff1; --muted: #9aa2a9; --line: #2c3237;
    --off: #2b3034; --off-ink: #c7ccd0; --travel: #2c2547; --travel-ink: #cbbdff; --bike: #cfc4a8;
    --ok: #4cc27f; --warn: #f0b04a; --bad: #ff7a70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111416; --surface: #1a1e21; --ink: #eceff1; --muted: #9aa2a9; --line: #2c3237;
  --off: #2b3034; --off-ink: #c7ccd0; --travel: #2c2547; --travel-ink: #cbbdff; --bike: #cfc4a8;
  --ok: #4cc27f; --warn: #f0b04a; --bad: #ff7a70;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
.display { font-family: var(--display); font-weight: 700; letter-spacing: 0.01em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num, .clock-time, .bs-num, .cd-num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1040px; margin: 0 auto; padding: 0 16px 48px; }
.top { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0 10px; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 10px; height: 34px; border-radius: 3px; background: var(--accent); flex: none; }
.brand h1 { font-family: var(--display); font-size: 22px; line-height: 1.05; }
.sub { margin: 0; font-size: 12px; color: var(--muted); }
.clock { display: grid; justify-items: end; gap: 1px; }
.clock-time { font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1; }
.clock-date { font-size: 12px; color: var(--muted); }
.sync { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.synced .dot, .sync-line.synced .dot { background: var(--ok); }
.sync.offline .dot, .sync.slow .dot, .sync-line.offline .dot, .sync-line.slow .dot { background: var(--warn); }
.sync.readonly .dot { background: var(--bad); }

.tabs { position: sticky; top: 62px; z-index: 4; display: flex; gap: 4px; overflow-x: auto; padding: 4px; margin: 0 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: none; padding: 7px 14px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; }
.tabs a.on { background: var(--ink); color: var(--bg); }

.stack { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.section-title { font-family: var(--display); font-size: 20px; margin-bottom: 6px; }
.section-head .section-title { margin-bottom: 0; }
.mini-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 4px 0 8px; }
.eyebrow { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.count { display: inline-block; min-width: 26px; padding: 0 7px; margin-left: 4px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 15px; text-align: center; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.note, .note-inline { color: var(--warn); }
.note { margin: 8px 0 0; font-weight: 600; }
.warn { color: var(--warn); }

/* buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 6px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-align: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.print { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.danger-text { color: var(--bad); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.link-btn { background: none; border: 0; padding: 0 0 0 6px; color: var(--ink); text-decoration: underline; cursor: pointer; font-size: inherit; }
.icon-btn { width: 36px; height: 36px; flex: none; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 16px; line-height: 1; }
.icon-btn.danger { color: var(--bad); }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span, .field-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 0; }
input:not([type="checkbox"]):not([type="file"]), select, textarea { width: 100%; min-height: 38px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
textarea { resize: vertical; }
.small-field input { max-width: 140px; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.pill.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill.static { cursor: default; background: var(--bg); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.seg button { flex: 1 1 auto; border: 0; background: transparent; padding: 7px 10px; border-radius: 7px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.15); }
.confirm { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 600; }

/* ticks */
.tick { display: flex; align-items: flex-start; gap: 10px; padding: 8px 4px; cursor: pointer; border-radius: 8px; min-width: 0; }
.tick:hover { background: var(--bg); }
.tick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tick .box { flex: none; width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 6px; display: grid; place-items: center; margin-top: 1px; }
.tick .box svg { width: 14px; height: 14px; fill: none; stroke: transparent; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tick.on .box { background: var(--ok); border-color: var(--ok); }
.tick.on .box svg { stroke: #fff; }
.tick input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
.tick-text { display: grid; min-width: 0; overflow-wrap: anywhere; }
.tick.on .tick-text { color: var(--muted); }
.tick-sub { font-size: 12px; color: var(--muted); }

.progress { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.progress .bar { width: 46px; height: 6px; border-radius: 3px; background: var(--off); overflow: hidden; }
.progress .bar span { display: block; height: 100%; background: var(--accent); }
.progress.full .bar span { background: var(--ok); }
.progress.full { color: var(--ok); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }

/* session chips */
.chips { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip-pair { display: inline-flex; gap: 3px; align-items: center; }
.ampm { font-size: 10px; font-weight: 700; color: var(--muted); margin-right: 1px; }
.chip { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
.chip.tt { background: var(--tt); color: var(--tt-ink); }
.chip.gym { background: var(--gym); color: var(--gym-ink); }
.chip.bike { background: var(--bike); color: var(--bike-ink); }
.chip.rec { background: var(--rec); color: var(--rec-ink); }
.chip.off { background: var(--off); color: var(--off-ink); }
.chip.travel { background: var(--travel); color: var(--travel-ink); }
.chip.other, .chip.none { background: var(--off); color: var(--off-ink); }
.chip.none { font-weight: 500; }
.chip.game.home { background: var(--home); color: var(--home-ink); }
.chip.game.away { background: var(--away); color: var(--away-ink); }
.chip.game.tbc { background: var(--tbc); color: var(--tbc-ink); }
.md { display: inline-block; white-space: nowrap; font-family: var(--display); font-weight: 700; font-size: 15px; padding: 1px 8px; border-radius: 6px; background: var(--ink); color: var(--bg); line-height: 1.4; }
.md.md-game { background: var(--accent); color: var(--accent-ink); }
.md.md-after { background: var(--off); color: var(--off-ink); }

/* today */
.today-hero .th-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.today-hero h2 { font-size: 30px; line-height: 1.05; }
.today-hero .md { font-size: 24px; padding: 2px 12px; }
.next-game { border-left: 6px solid var(--line); }
.next-game.is-home { border-left-color: var(--home); }
.next-game.is-away { border-left-color: var(--away); }
.ng-row { display: flex; justify-content: space-between; gap: 12px; }
.ng-row h3 { font-size: 26px; line-height: 1.05; margin: 2px 0 4px; }
.ng-row p { margin: 0; }
.countdown { display: grid; justify-items: center; align-content: start; min-width: 64px; }
.cd-num { font-family: var(--display); font-size: 44px; font-weight: 700; line-height: 1; }
.cd-lbl { font-size: 12px; color: var(--muted); }
.checklists { display: grid; gap: 14px; }
.cl-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 2px; }
.cl p { margin: 2px 0 8px; }
.rem-row { display: flex; align-items: center; gap: 6px; }
.rem-row .tick { flex: 1; }
.rem-row.overdue .tick-sub { color: var(--bad); font-weight: 600; }
.rem-form { display: grid; gap: 8px; margin-top: 10px; padding-top: 12px; border-top: 1px dashed var(--line); }
.rem-when { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rem-when input { width: auto !important; }
.ahead { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.ahead-day { display: grid; gap: 6px; justify-items: start; text-align: left; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; }
.ad-date { font-weight: 700; }

/* schedule */
.week-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.week-label { display: grid; justify-items: center; text-align: center; }
.week-label .display { font-size: 22px; }
.days { display: grid; gap: 8px; }
.day { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.day.is-today { border-color: var(--ink); box-shadow: inset 4px 0 0 var(--accent); }
.day.is-game { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 14%, var(--surface)), var(--surface) 60%); }
.day.is-done .day-head { opacity: 0.62; }
.day-head { width: 100%; display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: none; border: 0; text-align: left; cursor: pointer; }
.day-date { display: grid; justify-items: center; line-height: 1.05; }
.dd-wd { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
.dd-n { font-family: var(--display); font-weight: 700; font-size: 26px; }
.dd-m { font-size: 11px; color: var(--muted); }
.day-main { display: grid; gap: 4px; min-width: 0; }
.day-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.today-tag, .done-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 5px; }
.today-tag { background: var(--accent); color: var(--accent-ink); }
.done-tag { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.day-side { display: grid; justify-items: end; gap: 6px; }
.chev { color: var(--muted); font-size: 12px; }
.day-body { padding: 4px 14px 16px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
.day-edit { display: grid; gap: 10px; padding-top: 12px; border-top: 1px dashed var(--line); }
.day-edit p { margin: 0; }
.session-edit { display: flex; gap: 10px; flex-wrap: wrap; }
.jump { margin-top: 12px; max-width: 220px; }
.fx-list { display: grid; gap: 6px; margin: 10px 0; }
.fx { border: 1px solid var(--line); border-radius: 9px; }
.fx.past { opacity: 0.6; }
.fx summary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; list-style: none; }
.fx summary::-webkit-details-marker { display: none; }
.fx-date { font-weight: 700; min-width: 92px; }
.fx-opp { font-weight: 600; }
.fx-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 4px 12px 12px; }
.fx-form .wide { grid-column: 1 / -1; }
.fx-add { border-top: 1px dashed var(--line); padding-top: 12px; }
.fx-add .fx-form { padding: 0; }

/* bags */
.trip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 8px; }
.summary-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin: 10px 0 6px; }
.big-stat { display: grid; }
.bs-num { font-family: var(--display); font-size: 40px; font-weight: 700; line-height: 1; }
.bs-num small { font-size: 22px; color: var(--muted); }
.bs-lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.bags { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; align-items: start; }
.bag { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.bag.packed { border-color: var(--ok); }
.bag-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.bag-head .tick { flex: 1; }
.bag-name { font-weight: 700; }
.bag-toggle { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 10px 2px; cursor: pointer; flex: none; }
.bag-edit-closed { flex: 1; display: grid; text-align: left; background: none; border: 0; padding: 8px 4px; cursor: pointer; }
.bag-edit-head { display: grid; gap: 8px; flex: 1; min-width: 0; }
.trip-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 4px; }
.bag-items { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 4px; }
.item-row { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
.item-row .tick { flex: 1; padding: 6px 4px; }
.item-row > input { flex: 1; }
.item-row > select { width: 120px !important; flex: none; }
.bag-danger { margin-top: 8px; }
.edit-note { border-style: dashed; }
.edit-note p { margin: 0 0 10px; }
.carry { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 4px; }

/* lists */
.list-editor { display: grid; gap: 6px; }
.le-row { display: flex; gap: 6px; align-items: center; }
.le-add { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.le-add input { flex: 1; }

/* squad */
.squad-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.plist { display: grid; gap: 4px; max-height: 420px; overflow-y: auto; margin-top: 8px; padding-right: 2px; }
.prow { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 8px; align-items: center; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: left; cursor: pointer; }
.prow:hover { border-color: var(--muted); }
.prow.sel { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.pnum { font-family: var(--display); font-weight: 700; font-size: 18px; text-align: center; }
.pname { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.ppos { font-size: 12px; color: var(--muted); }
.padd { font-size: 12px; font-weight: 700; color: var(--muted); }
.sizes { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
.size-box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.size-box strong { font-size: 13px; margin-bottom: 2px; }
.size-line { display: flex; justify-content: space-between; font-size: 14px; }
.table-wrap { overflow-x: auto; margin-top: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }

/* player editor */
.group-label { margin: 8px 0 2px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.ptable td { padding: 4px; vertical-align: middle; }
.ptable input, .ptable select { min-height: 34px !important; padding: 4px 6px !important; }
.order-cell { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.order-cell .num { min-width: 20px; font-weight: 700; }
.order-cell .icon-btn { width: 30px; height: 30px; }
.w-num { width: 54px !important; } .w-name { width: 170px !important; } .w-pos { width: 56px !important; } .w-size { width: 74px !important; }
.peditor { display: grid; gap: 10px; }

/* game day */
.gd-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-top: 12px; }
.gd-head h2 { font-size: 28px; line-height: 1.05; }
.gd-head p { margin: 2px 0 8px; }

/* guide */
.prose p, .prose li { max-width: 68ch; }
.prose h2 { font-size: 26px; margin-bottom: 6px; }
.prose h3 { font-family: var(--display); font-size: 20px; margin: 18px 0 6px; }
.prose ol { padding-left: 20px; display: grid; gap: 4px; }
.codes { display: grid; gap: 6px; }
.code-row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; }
.sync-line { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 10; max-width: calc(100% - 32px); }

@media (max-width: 560px) {
  body { font-size: 15px; }
  .brand h1 { font-size: 19px; }
  .sub { display: none; }
  .clock-time { font-size: 19px; }
  .tabs { position: static; display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 12px; overflow: visible; }
  .tabs a { text-align: center; padding: 7px 4px; font-size: 13px; border-radius: 8px; }
  .day-head { grid-template-columns: 44px 1fr; }
  .day-side { grid-column: 2; justify-items: start; grid-auto-flow: column; justify-content: start; align-items: center; }
